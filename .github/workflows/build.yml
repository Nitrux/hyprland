name: Build Hyprland Debian packages

on:
  workflow_dispatch:

jobs:
  build-amd64:
    runs-on: ubuntu-24.04
    container:
      image: debian:stable-20260713
      env:
        DEBIAN_FRONTEND: noninteractive
        PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}

    steps:
      - name: Install CA certificates
        run: apt update && apt install -y ca-certificates

      - name: Divert files conflicting during the APT transition
        run: dpkg-divert --package util-linux --no-rename --add /usr/bin/logger

      - name: Update APT sources and upgrade
        run: |
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/10no-check-valid-until
          cat <<EOF > /etc/apt/sources.list.d/debian.sources
          Types: deb
          URIs: https://snapshot.debian.org/archive/debian/20260725T202958Z
          Suites: testing testing-updates
          Components: main non-free non-free-firmware contrib
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
          Architectures: amd64
          EOF
          apt update && apt -o Dpkg::Options::=--force-overwrite full-upgrade -y

      - name: Setup amd64 environment
        run: apt install -y build-essential devscripts git gnupg ruby-full
      - name: Install Packagecloud CLI
        run: gem install package_cloud
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Mark workspace as safe for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Initialize package sources
        run: git submodule update --init --recursive
      - name: Verify pinned package sources
        run: |
          git submodule status --recursive
          if git submodule status --recursive | grep -q "^-"; then
            echo "An uninitialized submodule was found."
            exit 1
          fi
      - run: ./scripts/install-build-deps.sh
      - run: ./scripts/build-deb.sh
        env:
          TARGET_ARCH: amd64
      - uses: actions/upload-artifact@v4
        with:
          name: deb-packages-amd64
          path: ./build/*.deb
      - name: Upload packages to Packagecloud
        run: package_cloud push nitrux/hyprland/debian/nitrux ./build/*.deb --skip-errors

  build-arm64:
    runs-on: ubuntu-24.04-arm
    container:
      image: arm64v8/debian:stable-20260713
      env:
        DEBIAN_FRONTEND: noninteractive
        PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}

    steps:
      - name: Install CA certificates
        run: apt update && apt install -y ca-certificates

      - name: Divert files conflicting during the APT transition
        run: dpkg-divert --package util-linux --no-rename --add /usr/bin/logger

      - name: Update APT sources and upgrade
        run: |
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/10no-check-valid-until
          cat <<EOF > /etc/apt/sources.list.d/debian.sources
          Types: deb
          URIs: https://snapshot.debian.org/archive/debian/20260725T202958Z
          Suites: testing testing-updates
          Components: main non-free non-free-firmware contrib
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
          Architectures: arm64
          EOF
          apt update && apt -o Dpkg::Options::=--force-overwrite full-upgrade -y

      - name: Setup arm64 environment
        run: apt install -y build-essential devscripts git gnupg ruby-full
      - name: Install Packagecloud CLI
        run: gem install package_cloud
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Mark workspace as safe for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Initialize package sources
        run: git submodule update --init --recursive
      - name: Verify pinned package sources
        run: |
          git submodule status --recursive
          if git submodule status --recursive | grep -q "^-"; then
            echo "An uninitialized submodule was found."
            exit 1
          fi
      - run: ./scripts/install-build-deps.sh
      - run: ./scripts/build-deb.sh
        env:
          TARGET_ARCH: arm64
      - uses: actions/upload-artifact@v4
        with:
          name: deb-packages-arm64
          path: ./build/*.deb
      - name: Upload packages to Packagecloud
        run: package_cloud push nitrux/hyprland/debian/nitrux ./build/*.deb --skip-errors
